server:
  port: 8084

spring:
  application:
    name: reporting-service

  datasource:
    url: jdbc:postgresql://localhost:5432/cashflow
    username: cashflow
    password: cashflow
    hikari:
      maximum-pool-size: 5
      pool-name: reporting-service-pool

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: "local-dev-only-shared-secret-please-change-me-32B"
    expiration-seconds: 3600
  reporting:
    output-dir: ./reports
    # Every day at 23:00 UTC, matching Appendix F.7's cut-off.
    cron: "0 0 23 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.cashflow.ledger: INFO
