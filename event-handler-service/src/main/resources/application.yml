server:
  port: 8083

spring:
  application:
    name: event-handler-service

  datasource:
    url: jdbc:postgresql://localhost:5432/cashflow
    username: cashflow
    password: cashflow
    hikari:
      maximum-pool-size: 10
      pool-name: event-handler-service-pool

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: event-handler-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.cashflow.ledger.eventhandler.domain"
        spring.json.value.default.type: com.cashflow.ledger.eventhandler.domain.CreditDebitEvent
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  kafka:
    topic:
      credit-debit-events: ledger.credit-debit.events
      credit-debit-events-dlq: ledger.credit-debit.events.dlq
      partitions: 3
      replicas: 1
    listener:
      concurrency: 2
      retry-interval-ms: 1000
      max-retry-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.cashflow.ledger: INFO
