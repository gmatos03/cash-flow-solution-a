server:
  port: 8081

spring:
  application:
    name: command-service

  datasource:
    url: jdbc:postgresql://localhost:5432/cashflow
    username: cashflow
    password: cashflow
    hikari:
      maximum-pool-size: 10
      pool-name: command-service-pool

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

app:
  jwt:
    secret: "local-dev-only-shared-secret-please-change-me-32B"
    expiration-seconds: 3600
  kafka:
    topic:
      credit-debit-events: ledger.credit-debit.events
      partitions: 3
      replicas: 1
  idempotency:
    ttl-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.cashflow.ledger: INFO
